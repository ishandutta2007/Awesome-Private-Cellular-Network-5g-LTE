<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#07162c"/><stop offset="100%" stop-color="#040914"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="50%" stop-color="#4facfe"/><stop offset="100%" stop-color="#00c6ff"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(16, 30, 54, 0.75)"/><stop offset="100%" stop-color="rgba(8, 17, 34, 0.85)"/></linearGradient><style>@keyframes pulse{0%{r:10px;opacity:.8;stroke-width:2px}50%{r:60px;opacity:.3;stroke-width:4px}}@keyframes signalWave{0%{stroke-dashoffset:200}}@keyframes floatNode{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes glowPulse{0%{filter:drop-shadow(0 0 5px rgba(0,242,254,.4))}50%{filter:drop-shadow(0 0 20px rgba(0,242,254,.9))}}.ring1{animation:pulse 3s infinite ease-out}.ring2{animation:pulse 3s infinite ease-out 1s}.ring3{animation:pulse 3s infinite ease-out 2s}.signalLine{stroke-dasharray:20;animation:signalWave 4s linear infinite}.floatingCard{animation:floatNode 6s ease-in-out infinite}.glowText{animation:glowPulse 4s infinite ease-in-out}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" rx="16"/><g stroke="#00f2fe" stroke-width="1" opacity=".08"><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" d="M 40 0 L 0 0 0 40"/></pattern><rect width="1200" height="360" fill="url(#grid)"/></g><g transform="translate(1000, 180)"><circle cx="0" cy="0" fill="none" stroke="#00f2fe" class="ring1"/><circle cx="0" cy="0" fill="none" stroke="#4facfe" class="ring2"/><circle cx="0" cy="0" fill="none" stroke="#00c6ff" class="ring3"/><circle cx="0" cy="0" r="14" fill="#00f2fe" opacity=".9"/><circle cx="0" cy="0" r="6" fill="#fff"/></g><path fill="none" stroke="url(#textGrad)" stroke-width="2" d="M 150 280 Q 400 320 650 270 T 1000 180" class="signalLine" opacity=".3"/><path fill="none" stroke="#4facfe" stroke-width="1.5" d="M 80 80 Q 450 40 850 110 T 1000 180" class="signalLine" opacity=".25"/><g class="floatingCard" opacity=".35"><rect width="130" height="34" x="910" y="50" fill="url(#cardGrad)" stroke="#00f2fe" stroke-width="1" rx="17"/><text x="975" y="72" fill="#00f2fe" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">5G NR / O-RAN</text></g><g class="floatingCard" opacity=".35" style="animation-delay:-3s"><rect width="140" height="34" x="880" y="270" fill="url(#cardGrad)" stroke="#4facfe" stroke-width="1" rx="17"/><text x="950" y="292" fill="#4facfe" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">CBRS Band 48</text></g><g transform="translate(80, 50)"><rect width="220" height="30" x="0" y="0" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="1.5" rx="15"/><circle cx="15" cy="15" r="5" fill="#00f2fe"/><text x="28" y="20" fill="#00f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">CURATED 5G / LTE STACK</text></g><text x="80" y="130" fill="url(#textGrad)" class="glowText" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-.5">Awesome Private Cellular Network</text><text x="80" y="175" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" opacity=".95">5G Standalone (SA), Open RAN &amp; Enterprise LTE Ecosystem</text><text x="80" y="212" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">Open-Source Cores (Open5GS, free5GC, Ella Core) • Commercial Platforms (AWS, Celona, Cisco) • SDR RAN</text><g transform="translate(80, 250)"><rect width="130" height="36" x="0" y="0" fill="rgba(15, 23, 42, 0.8)" stroke="#334155" stroke-width="1.5" rx="8"/><text x="65" y="23" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📡 Open RAN</text><rect width="150" height="36" x="145" y="0" fill="rgba(15, 23, 42, 0.8)" stroke="#334155" stroke-width="1.5" rx="8"/><text x="220" y="23" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ eBPF 5G Core</text><rect width="140" height="36" x="310" y="0" fill="rgba(15, 23, 42, 0.8)" stroke="#334155" stroke-width="1.5" rx="8"/><text x="380" y="23" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔒 CBRS &amp; Private</text></g></svg>