<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#07162c" />
      <stop offset="100%" stop-color="#040914" />
    </linearGradient>

    <!-- Vibrant Cyan-Blue Text & Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 30, 54, 0.75)" />
      <stop offset="100%" stop-color="rgba(8, 17, 34, 0.85)" />
    </linearGradient>

    <!-- Signal Pulse Animation -->
    <style>
      @keyframes pulse {
        0% { r: 10px; opacity: 0.8; stroke-width: 2px; }
        50% { r: 60px; opacity: 0.3; stroke-width: 4px; }
        100% { r: 110px; opacity: 0; stroke-width: 1px; }
      }
      @keyframes signalWave {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatNode {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      @keyframes glowPulse {
        0% { filter: drop-shadow(0 0 5px rgba(0, 242, 254, 0.4)); }
        50% { filter: drop-shadow(0 0 20px rgba(0, 242, 254, 0.9)); }
        100% { filter: drop-shadow(0 0 5px rgba(0, 242, 254, 0.4)); }
      }
      .ring1 { animation: pulse 3s infinite ease-out; }
      .ring2 { animation: pulse 3s infinite ease-out 1s; }
      .ring3 { animation: pulse 3s infinite ease-out 2s; }
      .signalLine { stroke-dasharray: 20; animation: signalWave 4s linear infinite; }
      .floatingCard { animation: floatNode 6s ease-in-out infinite; }
      .glowText { animation: glowPulse 4s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Grid Patterns in Background -->
  <g opacity="0.08" stroke="#00f2fe" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none"/>
    </pattern>
    <rect width="1200" height="360" fill="url(#grid)" />
  </g>

  <!-- 5G Signal Tower & Pulsing Waves (Background Dynamic Element) -->
  <g transform="translate(1000, 180)">
    <!-- Animated Expanding Radar Waves (Behind everything) -->
    <circle class="ring1" cx="0" cy="0" fill="none" stroke="#00f2fe" />
    <circle class="ring2" cx="0" cy="0" fill="none" stroke="#4facfe" />
    <circle class="ring3" cx="0" cy="0" fill="none" stroke="#00c6ff" />
    
    <!-- Central Node Core -->
    <circle cx="0" cy="0" r="14" fill="#00f2fe" opacity="0.9" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>

  <!-- Background Floating Network Topology Lines -->
  <path d="M 150 280 Q 400 320 650 270 T 1000 180" fill="none" stroke="url(#textGrad)" stroke-width="2" opacity="0.3" class="signalLine" />
  <path d="M 80 80 Q 450 40 850 110 T 1000 180" fill="none" stroke="#4facfe" stroke-width="1.5" opacity="0.25" class="signalLine" />

  <!-- Background Tech Pill Nodes -->
  <g opacity="0.35" class="floatingCard">
    <rect x="910" y="50" width="130" height="34" rx="17" fill="url(#cardGrad)" stroke="#00f2fe" stroke-width="1" />
    <text x="975" y="72" fill="#00f2fe" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">5G NR / O-RAN</text>
  </g>

  <g opacity="0.35" class="floatingCard" style="animation-delay: -3s;">
    <rect x="880" y="270" width="140" height="34" rx="17" fill="url(#cardGrad)" stroke="#4facfe" stroke-width="1" />
    <text x="950" y="292" fill="#4facfe" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">CBRS Band 48</text>
  </g>

  <!-- FOREGROUND CONTENT LAYER -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="220" height="30" rx="15" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="5" fill="#00f2fe" />
    <text x="28" y="20" fill="#00f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">CURATED 5G / LTE STACK</text>
  </g>

  <text x="80" y="130" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" class="glowText">
    Awesome Private Cellular Network
  </text>

  <text x="80" y="175" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" opacity="0.95">
    5G Standalone (SA), Open RAN &amp; Enterprise LTE Ecosystem
  </text>

  <text x="80" y="212" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">
    Open-Source Cores (Open5GS, free5GC, Ella Core) • Commercial Platforms (AWS, Celona, Cisco) • SDR RAN
  </text>

  <g transform="translate(80, 250)">
    <rect x="0" y="0" width="130" height="36" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#334155" stroke-width="1.5"/>
    <text x="65" y="23" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📡 Open RAN</text>

    <rect x="145" y="0" width="150" height="36" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#334155" stroke-width="1.5"/>
    <text x="220" y="23" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ eBPF 5G Core</text>

    <rect x="310" y="0" width="140" height="36" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#334155" stroke-width="1.5"/>
    <text x="380" y="23" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔒 CBRS &amp; Private</text>
  </g>
</svg>
